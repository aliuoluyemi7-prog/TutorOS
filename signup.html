<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Tutor OS</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="center-screen">
  <form class="card" id="signup-form" novalidate>
    <h1>Create your account</h1>
    <p class="subtitle">Set up your tutoring business in a few minutes.</p>

    <label for="full-name">Full name</label>
    <input type="text" id="full-name" autocomplete="name" required />
    <div class="field-error" id="name-error"></div>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required />
    <div class="field-error" id="email-error"></div>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" required minlength="8" />
    <div class="field-error" id="password-error"></div>

    <button type="submit" class="btn-primary" id="submit-btn">Sign up</button>

    <div class="link-row">
      Already have an account? <a href="/login.html">Log in</a>
    </div>
  </form>
</div>
<div id="toast" class="toast"></div>

<script type="module">
  import { signUp } from '/auth.js';
  import { showToast, withLoading, isValidEmail, isNonEmpty, friendlyError } from '/ui-helpers.js';

  const form = document.getElementById('signup-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('name-error').textContent = '';
    document.getElementById('email-error').textContent = '';
    document.getElementById('password-error').textContent = '';

    const fullName = document.getElementById('full-name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!isNonEmpty(fullName)) {
      document.getElementById('name-error').textContent = 'Enter your full name.';
      valid = false;
    }
    if (!isValidEmail(email)) {
      document.getElementById('email-error').textContent = 'Enter a valid email address.';
      valid = false;
    }
    if (password.length < 8) {
      document.getElementById('password-error').textContent = 'Password must be at least 8 characters.';
      valid = false;
    }
    if (!valid) return;

    await withLoading(submitBtn, 'Creating account...', async () => {
      const { error } = await signUp({ fullName, email, password });
      if (error) {
        showToast(friendlyError(error), 'danger');
        return;
      }
      window.location.href = '/verify-email.html';
    });
  });
</script>
</body>
</html>
