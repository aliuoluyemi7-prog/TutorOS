<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subjects — Tutor OS</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<div class="page">
  <header class="app-header">
    <div>
      <div class="business-name" id="business-name">Loading...</div>
      <div class="role-badge" id="role-badge"></div>
    </div>
    <button class="logout-btn" id="logout-btn">Log out</button>
  </header>

  <main class="app-main">
    <button class="back-link" id="back-link">&larr; Dashboard</button>

    <div class="page-title-row">
      <h1>Subjects</h1>
    </div>

    <!-- Inline quick-create form, hidden until "+ Add Subject" is tapped -->
    <form class="card inline-form-card" id="create-form" novalidate hidden>
      <label for="subject-name">Subject name</label>
      <input type="text" id="subject-name" required autocomplete="off" />
      <div class="field-error" id="subject-name-error"></div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="create-submit-btn">Add subject</button>
        <button type="button" class="btn-secondary" id="create-cancel-btn">Cancel</button>
      </div>
    </form>

    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Search subjects..." />
    </div>

    <div id="list-loading">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div class="empty-state" id="empty-state" hidden></div>

    <div class="list-group" id="list-group" hidden></div>
  </main>

  <button class="fab-add" id="fab-add" title="Add subject" aria-label="Add subject">+</button>
</div>
<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth } from './router-guard.js';
  import { signOut } from './auth.js';
  import { resolveWorkspace } from './workspace.js';
  import { getBusiness, getMyRoleInBusiness } from './business.js';
  import { showToast, withLoading, isNonEmpty, friendlyError } from './ui-helpers.js';
  import { supabase } from './supabase-client.js';

  await requireAuth();

  // Same resolution pattern as the other Phase 2 screens.
  let businessId;
  try {
    const result = await resolveWorkspace();
    if (result.action === 'onboarding') {
      window.location.replace('./business-setup.html');
      throw new Error('redirecting');
    }
    if (result.action === 'choose-workspace') {
      window.location.replace('./choose-workspace.html');
      throw new Error('redirecting');
    }
    businessId = result.businessId;
  } catch (e) {
    if (e.message !== 'redirecting') showToast(friendlyError(e), 'danger');
    throw e;
  }

  const [{ business, error: bizError }, role] = await Promise.all([
    getBusiness(businessId),
    getMyRoleInBusiness(businessId),
  ]);

  if (bizError || !business) {
    showToast('Could not load your business.', 'danger');
  } else {
    document.getElementById('business-name').textContent = business.name;
  }
  document.getElementById('role-badge').textContent = role || '';

  document.getElementById('back-link').addEventListener('click', () => {
    window.location.href = './dashboard.html';
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut();
    window.location.href = './login.html';
  });

  // ---------- state ----------
  let allSubjects = [];
  let searchTerm = '';
  let editingId = null; // subject id currently in inline-rename mode, or null

  const listGroupEl = document.getElementById('list-group');
  const emptyStateEl = document.getElementById('empty-state');
  const loadingEl = document.getElementById('list-loading');

  await loadSubjects();

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderList();
  });

  // ---------- quick-create form open/close ----------
  const createForm = document.getElementById('create-form');
  const fabAdd = document.getElementById('fab-add');

  fabAdd.addEventListener('click', () => {
    createForm.hidden = false;
    fabAdd.hidden = true;
    document.getElementById('subject-name').focus();
  });

  document.getElementById('create-cancel-btn').addEventListener('click', () => {
    closeCreateForm();
  });

  function closeCreateForm() {
    createForm.hidden = true;
    fabAdd.hidden = false;
    createForm.reset();
    document.getElementById('subject-name-error').textContent = '';
  }

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('subject-name-error').textContent = '';

    const name = document.getElementById('subject-name').value.trim();

    if (!isNonEmpty(name)) {
      document.getElementById('subject-name-error').textContent = 'Enter a subject name.';
      return;
    }

    const submitBtn = document.getElementById('create-submit-btn');
    await withLoading(submitBtn, 'Adding...', async () => {
      const { data, error } = await supabase
        .from('subjects')
        .insert({
          business_id: businessId,
          name,
        })
        .select('id, name, active, created_at')
        .single();

      if (error) {
        // unique (business_id, name) — most likely failure is a duplicate name
        if (error.code === '23505') {
          document.getElementById('subject-name-error').textContent = 'A subject with this name already exists.';
        } else {
          showToast(friendlyError(error), 'danger');
        }
        return;
      }

      allSubjects.push(data);
      allSubjects.sort((a, b) => a.name.localeCompare(b.name));
      renderList();
      closeCreateForm();
      showToast(`${data.name} added.`, 'info');
    });
  });

  // ---------- data ----------
  async function loadSubjects() {
    loadingEl.hidden = false;
    listGroupEl.hidden = true;
    emptyStateEl.hidden = true;

    const { data, error } = await supabase
      .from('subjects')
      .select('id, name, active, created_at')
      .eq('business_id', businessId)
      .order('name', { ascending: true });

    loadingEl.hidden = true;

    if (error) {
      showToast(friendlyError(error), 'danger');
      emptyStateEl.hidden = false;
      emptyStateEl.textContent = 'Could not load subjects. Pull down to refresh, or try again.';
      return;
    }

    allSubjects = data || [];
    renderList();
  }

  // ---------- rename ----------
  function startRename(id) {
    editingId = id;
    renderList();
  }

  async function saveRename(id, inputEl, saveBtn) {
    const newName = inputEl.value.trim();
    if (!isNonEmpty(newName)) {
      showToast('Subject name can\u2019t be empty.', 'danger');
      return;
    }

    await withLoading(saveBtn, 'Saving...', async () => {
      const { data, error } = await supabase
        .from('subjects')
        .update({ name: newName })
        .eq('id', id)
        .select('id, name, active, created_at')
        .single();

      if (error) {
        if (error.code === '23505') {
          showToast('A subject with this name already exists.', 'danger');
        } else {
          showToast(friendlyError(error), 'danger');
        }
        return;
      }

      const idx = allSubjects.findIndex((s) => s.id === id);
      if (idx !== -1) allSubjects[idx] = data;
      allSubjects.sort((a, b) => a.name.localeCompare(b.name));
      editingId = null;
      renderList();
      showToast('Subject renamed.', 'info');
    });
  }

  function cancelRename() {
    editingId = null;
    renderList();
  }

  // ---------- deactivate / reactivate ----------
  async function toggleActive(id, currentlyActive, btnEl) {
    const label = currentlyActive ? 'Deactivating...' : 'Reactivating...';
    await withLoading(btnEl, label, async () => {
      const { data, error } = await supabase
        .from('subjects')
        .update({ active: !currentlyActive })
        .eq('id', id)
        .select('id, name, active, created_at')
        .single();

      if (error) {
        showToast(friendlyError(error), 'danger');
        return;
      }

      const idx = allSubjects.findIndex((s) => s.id === id);
      if (idx !== -1) allSubjects[idx] = data;
      renderList();
      showToast(
        data.active ? `${data.name} reactivated.` : `${data.name} deactivated.`,
        'info'
      );
    });
  }

  // ---------- render ----------
  function renderList() {
    const filtered = searchTerm
      ? allSubjects.filter((s) => s.name.toLowerCase().includes(searchTerm))
      : allSubjects;

    if (allSubjects.length === 0) {
      listGroupEl.hidden = true;
      emptyStateEl.hidden = false;
      emptyStateEl.textContent = 'No subjects yet. Tap the + button to add your first subject.';
      return;
    }

    if (filtered.length === 0) {
      listGroupEl.hidden = true;
      emptyStateEl.hidden = false;
      emptyStateEl.textContent = `No subjects match "${searchTerm}".`;
      return;
    }

    emptyStateEl.hidden = true;
    listGroupEl.hidden = false;
    listGroupEl.innerHTML = '';

    filtered.forEach((subject) => {
      const item = document.createElement('div');
      item.className = 'list-item';

      if (editingId === subject.id) {
        item.innerHTML = `
          <input type="text" class="list-item-edit-input" value="" />
          <div class="list-item-actions">
            <button type="button" class="btn-inline" data-action="save">Save</button>
            <button type="button" class="btn-inline" data-action="cancel">Cancel</button>
          </div>
        `;
        const input = item.querySelector('.list-item-edit-input');
        input.value = subject.name;
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') item.querySelector('[data-action="save"]').click();
          if (e.key === 'Escape') cancelRename();
        });
        item.querySelector('[data-action="save"]').addEventListener('click', (e) => {
          saveRename(subject.id, input, e.currentTarget);
        });
        item.querySelector('[data-action="cancel"]').addEventListener('click', cancelRename);
        listGroupEl.appendChild(item);
        input.focus();
        input.select();
        return;
      }

      item.innerHTML = `
        <div class="list-item-main">
          <div class="list-item-title"></div>
        </div>
        <span class="status-badge status-badge--${subject.active ? 'active' : 'inactive'}"></span>
        <div class="list-item-actions">
          <button type="button" class="btn-inline" data-action="rename">Rename</button>
          <button type="button" class="btn-inline ${subject.active ? 'btn-inline--danger' : ''}" data-action="toggle"></button>
        </div>
      `;
      item.querySelector('.list-item-title').textContent = subject.name;
      item.querySelector('.status-badge').textContent = subject.active ? 'active' : 'inactive';

      const toggleBtn = item.querySelector('[data-action="toggle"]');
      toggleBtn.textContent = subject.active ? 'Deactivate' : 'Reactivate';
      toggleBtn.addEventListener('click', (e) => {
        toggleActive(subject.id, subject.active, e.currentTarget);
      });

      item.querySelector('[data-action="rename"]').addEventListener('click', () => {
        startRename(subject.id);
      });

      listGroupEl.appendChild(item);
    });
  }
</script>
</body>
</html>
