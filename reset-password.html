<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Tutor OS</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="center-screen">

  <!-- Step A: request a reset email -->
  <form class="card" id="request-form" novalidate>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required />
    <div class="field-error" id="email-error"></div>

    <button type="submit" class="btn-primary" id="request-btn">Send reset link</button>
    <div class="link-row"><a href="login.html">Back to login</a></div>
  </form>

  <!-- Step B: shown only when the user arrives via the emailed link -->
  <form class="card" id="update-form" novalidate style="display:none;">
    <h1>Choose a new password</h1>
    <p class="subtitle">Enter a new password for your account.</p>

    <label for="new-password">New password</label>
    <input type="password" id="new-password" autocomplete="new-password" required minlength="8" />
    <div class="field-error" id="new-password-error"></div>

    <button type="submit" class="btn-primary" id="update-btn">Update password</button>
  </form>

</div>
<div id="toast" class="toast"></div>

<script type="module">
  import { supabase } from './supabase-client.js';
  import { requestPasswordReset, updatePassword } from './auth.js';
  import { showToast, withLoading, isValidEmail, friendlyError } from './ui-helpers.js';

  const requestForm = document.getElementById('request-form');
  const updateForm = document.getElementById('update-form');

  // Supabase places the user in a "recovery" auth state when they land
  // here from the emailed link — detect that and show the update form.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      requestForm.style.display = 'none';
      updateForm.style.display = 'block';
    }
  });

  requestForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('email-error').textContent = '';
    const email = document.getElementById('email').value.trim();

    if (!isValidEmail(email)) {
      document.getElementById('email-error').textContent = 'Enter a valid email address.';
      return;
    }

    const btn = document.getElementById('request-btn');
    await withLoading(btn, 'Sending...', async () => {
      const { error } = await requestPasswordReset(email);
      if (error) {
        showToast(friendlyError(error), 'danger');
        return;
      }
      showToast('Reset link sent. Check your inbox.', 'info');
    });
  });

  updateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('new-password-error').textContent = '';
    const newPassword = document.getElementById('new-password').value;

    if (newPassword.length < 8) {
      document.getElementById('new-password-error').textContent = 'Password must be at least 8 characters.';
      return;
    }

    const btn = document.getElementById('update-btn');
    await withLoading(btn, 'Updating...', async () => {
      const { error } = await updatePassword(newPassword);
      if (error) {
        showToast(friendlyError(error), 'danger');
        return;
      }
      showToast('Password updated. Redirecting to login...', 'info');
      setTimeout(() => window.location.href = 'login.html', 1500);
    });
  });
</script>
</body>
</html>
