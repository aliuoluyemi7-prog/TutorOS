<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Tutor OS</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<div class="center-screen">
  <form class="card" id="login-form" novalidate>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your tutoring business.</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required />
    <div class="field-error" id="email-error"></div>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <div class="field-error" id="password-error"></div>

    <button type="submit" class="btn-primary" id="submit-btn">Log in</button>

    <div class="link-row">
      <button type="button" class="btn-link" id="forgot-link">Forgot password?</button>
    </div>
    <div class="link-row">
      Don't have an account? <a href="./signup.html">Sign up</a>
    </div>
  </form>
</div>
<div id="toast" class="toast"></div>

<script type="module">
  import { signIn } from './auth.js';
  import { resolveWorkspace } from './workspace.js';
  import { showToast, withLoading, isValidEmail, isNonEmpty, friendlyError } from './ui-helpers.js';

  const form = document.getElementById('login-form');
  const submitBtn = document.getElementById('submit-btn');

  document.getElementById('forgot-link').addEventListener('click', () => {
    window.location.href = './reset-password.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('email-error').textContent = '';
    document.getElementById('password-error').textContent = '';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!isValidEmail(email)) {
      document.getElementById('email-error').textContent = 'Enter a valid email address.';
      valid = false;
    }
    if (!isNonEmpty(password)) {
      document.getElementById('password-error').textContent = 'Enter your password.';
      valid = false;
    }
    if (!valid) return;

    await withLoading(submitBtn, 'Logging in...', async () => {
      const { error } = await signIn({ email, password });
      if (error) {
        showToast(friendlyError(error), 'danger');
        return;
      }

      try {
        const result = await resolveWorkspace();
        if (result.action === 'onboarding') {
          window.location.href = './business-setup.html';
        } else if (result.action === 'choose-workspace') {
          window.location.href = './choose-workspace.html';
        } else {
          window.location.href = './dashboard.html';
        }
      } catch (workspaceError) {
        showToast(friendlyError(workspaceError), 'danger');
      }
    });
  });
</script>
</body>
</html>
